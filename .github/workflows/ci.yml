name: CI

permissions: read-all

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Cancel in-progress runs for PRs (same head branch), but never cancel
# pushes to main so that every merge gets a full CI run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Resolves through MODULE.bazel, the only dependency path Bazel 9 offers.
  build-and-test:
    runs-on: [self-hosted, cpu]
    steps:
      # Full history so bazel-diff can check out and hash the PR base revision.
      - name: Checkout PrimeIR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # PRs build and test only the targets bazel-diff reports as impacted by
      # the base..head change; pushes to main run the full suite.
      - name: Run `bazel test` (diff only)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BAZEL_DIFF=$(mktemp -t bazel-diff.XXXXXX.jar)
          # Fetch via the release API rather than the browser-download CDN: the
          # latter intermittently 504s and a bare `curl -Lo` would save the HTML
          # error page as a corrupt jar. `gh` validates the asset and --clobber
          # overwrites the mktemp placeholder.
          gh release download 17.0.2 --repo Tinder/bazel-diff \
            --pattern bazel-diff_deploy.jar --output "$BAZEL_DIFF" --clobber
          ./build_tools/github_actions/ci_build_bazel.sh "$BAZEL_DIFF" \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}"

      - name: Run `bazel test` (all)
        if: github.event_name != 'pull_request'
        run: ./build_tools/github_actions/ci_build_bazel.sh

      # Capture the runner-local test.log a failed test leaves behind — the CI
      # stream only carries the FAIL summary, not the gtest output.
      - name: Upload bazel test logs
        if: ${{ failure() }}
        uses: fractalyze/.github/.github/actions/upload-bazel-testlogs@main

  # `build-and-test` builds PrimeIR as the *root* module, where
  # `archive_override` and patches still apply; a consumer resolves it as a
  # non-root module, where they do not. Only a separate module can tell the two
  # apart, so this lane builds one, and proves that a project can `bazel_dep` on
  # PrimeIR and resolve every target it references.
  bzlmod-consumer:
    runs-on: [self-hosted, cpu]
    steps:
      # Full history so the change detection below can diff against the PR base.
      - name: Checkout PrimeIR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # What PrimeIR exposes to a consumer is decided entirely by its build
      # definition, so a PR touching none of those files cannot change this
      # lane's result. Pushes to main always run it.
      - name: Detect build-definition changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ -z "$BASE_SHA" ]]; then
            echo "Not a pull request; running the lane."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # `*.bazel*` covers MODULE.bazel(.lock), BUILD.bazel, .bazelrc*,
          # .bazelversion and .bazelignore at any depth: pathspecs use
          # git's default wildmatch, where `*` also crosses `/`. The pip lock is
          # read by `pip.parse` in MODULE.bazel, so it changes what a consumer
          # resolves. The last entry re-runs the lane when its own definition
          # changes.
          CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- \
            '*.bazel*' '*.bzl' 'third_party' 'bazel' \
            '*requirements_lock_*.txt' '.github/workflows/ci.yml')
          if [[ -n "$CHANGED" ]]; then
            echo "Build-definition files changed:"
            echo "$CHANGED"
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No build-definition change; skipping the consumer lane."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run `bazel test` in the consumer module
        if: steps.changes.outputs.run == 'true'
        working-directory: bazel/bzlmod_consumer
        run: bazel --bazelrc=.bazelrc.ci test --config=ci //...

      - name: Resolve every PrimeIR target as a dependency
        if: steps.changes.outputs.run == 'true'
        working-directory: bazel/bzlmod_consumer
        run: |
          bazel --bazelrc=.bazelrc.ci build --config=ci \
            @prime_ir//prime_ir/... \
            @prime_ir//tools/...

      - name: Upload bazel test logs
        if: ${{ failure() }}
        uses: fractalyze/.github/.github/actions/upload-bazel-testlogs@main

  pre-commit-style:
    if: github.actor != 'fractalyze-dev'
    runs-on: [self-hosted, cpu]
    steps:
      - name: Checkout PrimeIR
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Fetch base commit for pre-commit diff
        if: github.event_name == 'pull_request'
        run: git fetch origin ${{ github.event.pull_request.base.sha }} --depth=1

      - name: Checkout Setup Python
        uses: actions/setup-python@v4.7.0
        with:
          python-version: "3.10"

      - name: Install cpplint
        run: pip install cpplint

      # FIXME(ashjeong): clang-tidy currently fails on CI. See https://github.com/fractalyze/prime-ir/actions/runs/16904324348/job/47890440254 for more details.
      # - name: Refresh compile commands
      #   run: |
      #     bazel run --remote_cache=grpc://127.0.0.1:9092 @hedron_compile_commands//:refresh_all

      - name: Run pre-commit
        run: |
          pip install pre-commit
          pre-commit run --from-ref ${{ github.event.pull_request.base.sha || 'HEAD~1' }} --to-ref HEAD
