name: Pin Bump

on:
  repository_dispatch:
    types: [pin-bump]

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BUMPER_GH_PAT }}

      - name: Route and bump pin
        uses: fractalyze/github-actions/pin-bump@main
        if: github.event.client_payload.source_repo == 'zk_dtypes'
        with:
          upstream_repo: zk_dtypes
          upstream_commit: ${{ github.event.client_payload.commit }}
          # Three files pin zk_dtypes and must move together: MODULE.bazel
          # cannot load() the loader's pin, and the consumer fixture restates
          # the override because overrides are root-only.
          # //third_party/zk_dtypes:pin_sync_test fails if the first two drift;
          # the third is outside its target graph, so listing it here is the
          # only thing keeping it in step.
          pin_file: |
            third_party/zk_dtypes/workspace.bzl
            MODULE.bazel
            bazel/bzlmod_consumer/MODULE.bazel
          var_prefix: ZK_DTYPES
          github_token: ${{ secrets.BUMPER_GH_PAT }}
